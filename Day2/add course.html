<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body bgcolor="F87C63">
    <center>
    <h1>Add Course</h1>
    <form>
        <form>
            <table cellspacing="30"
        <tr>
        <td>Course name:</td>
        <td>
            <input type="text" placeholder="Enter name" required>
        </td>
        </tr>
        <tr>
       <td>Course id:</td>
       <td>
        <input type="text" placeholder="enter course id" required>
       </td>
       </tr>
       <tr>
        <td>Course Type:</td>
        <td>
            <select name="course" required>
            <option value="c1">Course1</option>
            <option value="c2">Course2</option>
            <option value="c3">Course3</option>
            </select>
       </td>
       </tr>
       <tr>
        <td>Description:</td>
        <td><textarea name="" id="" rows="10" cols="30" placeholder="enter a brief description" required></textarea>
            
        </td>
       </tr>
       <tr>
        <td>Education</td>
        <td>
            <input type="checkbox" value="UG">UG
            <input type="checkbox" value="PG">PG
            <input type="checkbox" value="Diploma">Diploma
             
        </td>
       </tr>
       <tr>
        <td>Gender</td>
        <td>
            <input type="radio" name="Gender" value="Male">Male
            <input type="radio" name="Gender" value="Female">Female
            <input type="radio" name="Gender" value="Other">Other
        </td>
        
       </tr>
       <tr>
        <td>Email</td>
        <td>
            <input type="email" placeholder="Enter valid mail id" required>
        </td>
       </tr>
       <tr>
        <td>Password</td>
        <td>
            <input type="password" placeholder="Enter password" required>
        </td>
       </tr>
       <tr>
        <td>
        <td>
            <input type="submit" value="Add Course" required>
            <input type="submit" value="Submit" required>
        </td>
        </td>
        </tr>

        </table>
         </form>
    

    </center>
</body>
</html>
