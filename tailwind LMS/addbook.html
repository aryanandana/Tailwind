<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add book</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex">
        <div class="w-80 h-150 bg-blue-950">
        <img src="./images/campusHIVE.png" alt="CampusHIVE logo" class="w-25 ml-25 mt-9">
        <div class="flex ml-25">
        <p class="text-red-500 font-semibold">Campus</p>
        <p class="text-yellow-600 font-extrabold">HIVE</p>
        </div>
        <p class="w-70 h-10 bg-blue-950 ml-2.5 text-center text-1xl font-bold pt-2 mt-10 text-white rounded-md hover:bg-blue-700">
        <a href="./viewbook.html">View Book</a>
        </p>
        <p class="w-70 h-10 bg-blue-950 ml-2.5 text-center text-1xl font-bold pt-2 mt-10 text-white rounded-md hover:bg-blue-700">
        <a href="./addbook.html">Add Book</a>
        </p>
        <p class="w-70 h-10 bg-blue-950 ml-2.5 text-center text-1xl font-bold pt-2 mt-10 text-white rounded-md hover:bg-blue-700">
        <a href="./issuebook.html">Issue Book</a>
        </p>
        <p class="w-70 h-10 bg-blue-950 ml-2.5 text-center text-1xl font-bold pt-2 mt-10 text-white rounded-md hover:bg-blue-700">
        <a href="./returnbook.html">Return Book</a>
        </p>
        <p class="w-70 h-10 bg-blue-950 ml-2.5 text-center text-1xl font-bold pt-2 mt-10 text-white rounded-md hover:bg-blue-700">
        <a href="./login.html">Logout</a>
        </p>
        </div>


         <div class="w-250 h-150  rounded-lg shadow-lg">
            <p class="text-blue-900 text-3xl font-bold ml-6 mt-2">Add Book</p>
            <div class="w-220 h-120 bg-white  ml-8 rounded-md shadow-md mt-5">
                <div class="flex">
                    <div class="ml-15 mt-6">
                        <input type="text" placeholder="Enter book title" class="w-100 h-10 bg-slate-300 ps-2  ">
                        <p> <input type="text" placeholder="Enter author name" class="w-100 h-10 bg-slate-300 ps-2 mt-2 "></p>
                       
                        <input type="text" placeholder="Enter ISBN number" class="w-100 h-10 bg-slate-300 ps-2 mt-2">
                        <p>
                        <select class="w-100 h-10 bg-slate-300 mt-2">
                            <option value="v1">c1</option>
                            <option value="v2">c2</option>
                            <option value="v3">c3</option>
                            <option value="v4">c4</option>
                        </select>
                        </p>
                        <input type="text" placeholder="Enter Publisher name" class="w-100 h-10 bg-slate-300  ps-2 mt-2">
                        <p>
                        <input type="text" placeholder="Enter year eg.(2020)" class="w-100 h-10 bg-slate-300 ps-2 mt-2">
                        </p>
                        <input type="text" placeholder="Enter number of copies" class="w-100 h-10 bg-slate-300  ps-2 mt-2">
                        <p>
                        <input type="text" placeholder="Enter shelf number" class="w-100 h-10 bg-slate-300  ps-2 mt-2">
                        </p>
                        <div class="flex">
                        <input type="button" value="Add Book" class=" ml-1 mt-5 w-30 h-10 rounded-md bg-blue-900 text-white font-semibold hover:bg-blue-950">
                        <input type="button" value="Reset" class=" ml-3  mt-5 w-30 h-10 rounded-md border-1 border-gray-500 text-gray-600 font-semibold hover:bg-blue-700 hover:text-white">
                        </div>
                    </div>
                <div class="w-80 h-100  ml-10 mt-10">
                <div class="border-2 border-dashed border-blue-400 rounded-lg h-80 bg-white flex flex-col justify-center items-center p-4">
                 <img src="https://shorturl.at/rPSMQ" class="w-24 h-24 mb-4" alt="Book upload icon">

                    <p class="font-semibold text-blue-950 underline">
                        Upload Book Cover
                    </p>
                    <p class="text-xs text-gray-400 mt-4">
                        JPG, PNG or JPEG
                    </p>
               </div>   
                

            </div>

         </div>


















    
    </div>
