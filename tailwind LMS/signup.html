<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-cyan-200">
    <div>
    <div>
        <img src="./images/campusHIVE.png" alt="CampusHIVE logo" class="w-25 ">
        <div class="flex">
        <p class="text-red-500 font-semibold">Campus</p>
        <p class="text-yellow-600 font-extrabold">HIVE</p>
        </div>
    </div>
    <div class="w-250 h-120 bg-white m-auto mt-3 rounded-xl flex sm:flex-row sm:flex">
        <div class="w-120 h-120 bg-cyan-500 rounded-md">
            <div class="flex pt-10 pl-25">
            <p class="text-white text-2xl font-bold">Welcome to</p>
            <div class="flex">
            
            <p class="text-red-500 pl-3 text-2xl font-semibold">Campus</p>
            <p class="text-yellow-600 font-extrabold text-2xl">HIVE</p>
            </div>
            </div>
            <div class="ml-35 pt-10">
            <p class="text-3xl text-white font-bold">Your Books.</p>
            <p class="text-3xl text-white font-bold">Your Knowledge.</p>
            <p class="text-3xl text-white font-bold">Our Library.</p>
            </div>
            <p class="text-center pt-5 text-white text-sm font-semibold">Access thousands of books,manage your borrowing,</p>
            <p class="text-center text-white text-sm font-semibold"> and make the most of your learninng journey.</p>
            <div>
                <img src="./images/book.jpg" alt="" class="w-10">
            </div>
        </div> 
        <div class="ml-10 mt-10">
        <p class="text-2xl font-bold">Create Your Account</p>
        <p class="text-xs font-semibold text-gray-400">Join CampusHIVE and start your learning journey.</p>
        <p class="w-80 h-8 bg-gray-200 ps-2 pt-1 mt-5 rounded-sm"><input type="text" placeholder="Full Name"></p> 
        <p class="w-80 h-8 bg-gray-200 ps-2 pt-1 mt-3 rounded-sm"><input type="text" placeholder="Student ID"></p> 
        <p class="w-80 h-8 bg-gray-200 ps-2 pt-1 mt-3 rounded-sm"><input type="text" placeholder="Email Address"></p> 
        <p class="w-80 h-8 bg-gray-200 ps-2 pt-1 mt-3 rounded-sm"><input type="text" placeholder="Password"></p> 
        <p class="w-80 h-8 bg-gray-200 ps-2 pt-1 mt-3 rounded-sm"><input type="text" placeholder="Confirm Password"></p> 
        <form action="./dashboard.html">
        <p class="w-80 h-10 bg-blue-700 ps-2 pt-2 mt-5 text-center rounded-md text-white hover:bg-blue-800"><input type="submit" value="Sign-Up"></p>
        <div class="flex mt-3 ml-15">
            <p class="text-sm font-semibold text-red-700">Already have an account?</p>
            <p class="text-blue-700 text-sm font-semibold pl-2"><a href="./login.html">Login</a></p>
        </div>
        </form> 
       </div>
         
    </div>
    
    
</body>
</html>
