<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Certificate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100">
    <div class="flex justify-between p-5">
        <p class="text-3xl font-semibold">Certificate Dapp</p>
        <div class="flex list-none gap-3">
             <li class="font-bold text-sm bg-slate-100  hover:bg-blue-600 w-30 h-10 text-center pt-2 "><a href="./home.html">Home</a></li>
        <li class="font-bold text-sm  bg-slate-100  hover:bg-blue-600 w-30 h-10 text-center pt-2"><a href="./issue.certificate.html">Issue Certificate</a></li>

        </div>
    </div>
    <div class="w-200 h-170 bg-white border-1  m-auto pl-10 pt-20">
        <p class="text-3xl">Issue New Certificate</p>
        <p class="pt-5">Select Course*</p>
        <select class="w-80 h-8 border-black border-1">
            <option value="v1">Certified Blockchain Assosiate</option>
            <option value="v2">Ethreum Devoloper Programme</option>
            <option value="v3">Certified Blockchain Architect</option>
        </select>
       <p class="pt-5">Certificate ID*</p>
       <input type="text" placeholder="Certificate ID" class="w-80 h-8 border-black border-1">
       <p class="pt-5">Candidate Name*</p>
       <p>
        <input type="text" placeholder="Name" class="w-80 h-8 border-black border-1">
       </p>
       
       <p class="pt-5">Select Grade*</p>
       <p>
        <select class="w-80 h-8 border-black border-1">
        <option value="g1">S</option>
        <option value="g2">A</option>
        <option value="g3">S</option>
         </select>
       </p>
       
        <p class="pt-5">Issue Date*</p>
        <p>
            <input type="date" class="w-80 h-8 border-black border-1">
        </p>
        <p>
            <form action="./certificate.html">
            <input type="submit" value="Issue Certificate" class="w-30 h-10 mt-5 bg-sky-500 rounded-md text-sm hover:bg-red-600">
            </form>
        </p>
      

    </div>
   
</body>
</html>
