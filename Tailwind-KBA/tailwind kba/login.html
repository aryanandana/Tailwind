<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-purple-100">
    <div class="h-100 w-90 bg-slate-50 m-auto mt-30 rounded-lg shadow-xl/30">
        
            <h1 class="text-center p-8 text-2xl font-bold text-violet-600">Login</h1>
            <h3 class="ml-10 font-medium">Email:</h3>
            <input type="text" required class="bg-slate-200 w-70 h-10 ml-10 mt-3 rounded-md border border-gray-400">
            <h3 class="ml-10 font-semibold mt-4">Password:</h3>
            <input type="password" required class="bg-slate-200 w-70 h-10 ml-10 mt-3 rounded-md border border-gray-400">
            <input type="submit" value="Login" class="bg-violet-600 w-20 h-9 rounded-md ml-10 mt-4 text-purple-200 font-medium border border-gray-400">
            <a href="" class="ml-17 mt-5 text-violet-500 font-medium" >Forgot password?</a>
            
            <h3 class="text-center mt-5">Don't have an account?
            <a href="./signup.html" class="text-violet-500 font-medium">Sign Up</a>
            </h3>
    </div>
    
</body>
</html>
