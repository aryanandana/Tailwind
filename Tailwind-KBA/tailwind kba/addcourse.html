<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex justify-between items-center p-4 bg-violet-200">

    
    <img src="./images/kba logo.jpg" alt="KBA Logo" class="w-10 h-10">

    
    <div class="flex gap-6 list-none"> 
        <li><a href="">Home</a></li>
        <li><a href="">Courses</a></li>
        <li><a href="">Contact Us</a></li>
        <li><a href="">Add Course</a></li>
        <li><a href="./signup.html">Logout</a></li>
    </div>

    </div>
    <div class="h-150 w-120 bg-violet-200 m-auto mt-10 rounded-lg shadow-xl/30">
        
            <h1 class="text-center p-3 text-2xl font-bold text-violet-900">Add Course</h1>
            <h3 class="ml-4 font-medium">Course Name:</h3>
            <input type="email" placeholder="eg.Certified Blockchain Associate" required class="bg-slate-200 w-110 h-8 ml-4 mt-1 rounded-md border ps-2  ">
            <h3 class="ml-4 mt-4 font-medium">Course ID:</h3>
            <input type="email" placeholder="eg.1" required class="bg-slate-200 w-110 h-8 ml-4 mt-1 rounded-md border ps-2  ">

            <h3 class="ml-4 font-semibold mt-4">Course Type:</h3>
            <select class="w-110 h-8 ml-4 mt-1 rounded-md bg-slate-200 border ps-2">
                <option>Self-Paced</option>
                <option>Live</option>
                <option>Online</option>
            </select>
            
            
            <h3 class="ml-4 font-semibold mt-4">Description:</h3>
            <textarea class="w-110 h-20 bg-slate-200 ml-4 mt-1"></textarea>


            <h3 class="ml-4 font-semibold mt-4">Price:</h3>
            
            <select class="w-110 h-8 ml-4 mt-1 rounded-md bg-slate-200 border ps-2">
                <option>5000</option>
                <option>1000</option>
                <option>15000</option>
            </select>
            <input type="submit" value="Add Course" class="bg-violet-800 w-110 h-8 border rounded-full mt-10 ml-4 text-violet-100">
    </div>

    
      
</body>
</html>
