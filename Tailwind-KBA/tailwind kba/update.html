<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
       
        
        
<div class="flex justify-between items-center p-4 bg-violet-200">

    
    <img src="./images/kba logo.jpg" alt="KBA Logo" class="w-10 h-10">

    
    <div class="flex gap-6 list-none">
        <li><a href="">Home</a></li>
        <li><a href="">Courses</a></li>
        <li><a href="">Contact Us</a></li>
        <li><a href="">Add Course</a></li>
        <li><a href="./signup.html">Logout</a></li>
    </div>

</div>
 
        <div class="h-120 w-120 bg-violet-200 m-auto mt-10 rounded-lg shadow-xl/30">
        
            <h1 class="text-center p-3 text-2xl font-bold text-violet-900">Update Course</h1>
            <h3 class="ml-4 font-medium">Course Name:</h3>
            <input type="email" placeholder="s122" required class="bg-slate-200 w-110 h-8 ml-4 mt-1 rounded-md border ps-2  ">
            <h3 class="ml-4 font-semibold mt-4">Course Type:</h3>
            <select class="w-110 h-8 ml-4 mt-1 rounded-md bg-slate-200 border ps-2">
                <option>Hybrid</option>
                <option>Offline</option>
                <option>Online</option>
            </select>
            
            
            <h3 class="ml-4 font-semibold mt-4">Description:</h3>
            <textarea class="w-110 h-20 bg-slate-200 ml-4 mt-1"></textarea>


            <h3 class="ml-4 font-semibold mt-4">Price:</h3>
            
            <select class="w-110 h-8 ml-4 mt-1 rounded-md bg-slate-200 border ps-2">
                <option>15000</option>
                <option>20000</option>
                <option>25000</option>
            </select>
            <input type="submit" value="Update Course" class="bg-violet-800 w-110 h-8 border rounded-full mt-3 ml-4 text-violet-100">
    </div>

    
      
   
</body>
</html>
