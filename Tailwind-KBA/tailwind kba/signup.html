<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-purple-100">
    <div class="h-130 w-80 bg-slate-50 m-auto mt-10 rounded-lg shadow-xl/30">
        
            <h1 class="text-center p-8 text-2xl font-bold text-violet-600">Sign Up</h1>
            <h3 class="ml-4 font-medium">Name:</h3>
            <input type="email" required class="bg-slate-200 w-70 h-10 ml-4 mt-1 rounded-md border  ">
            <h3 class="ml-4 font-semibold mt-4">Email:</h3>
            <input type="password" required class="bg-slate-200 w-70 h-10 ml-4 mt-1 rounded-md border">
            <h3 class="ml-4 font-semibold mt-4">Password:</h3>
            <input type="password" required class="bg-slate-200 w-70 h-10 ml-4 mt-1 rounded-md border ">
            <h3 class="ml-4 font-semibold mt-4">Users:</h3>
            
            <select class="w-70 h-10 ml-4 mt-3 rounded-md bg-slate-200 border">
                <option>Admin</option>
                <option>Faculty</option>
                <option>Student</option>

            </select>

            <input type="submit" value="Login" class="bg-violet-600 w-20 h-9 rounded-md ml-4 mt-3 text-purple-200 font-medium border">
            
            
            <h3 class="text-center mt-3">Already have an account?
            <a href="./login.html" class="text-violet-500 font-medium">Login</a>
            </h3> 
    </div>

    
</body>
</html>
