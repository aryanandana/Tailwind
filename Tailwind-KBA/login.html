<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-cyan-200">
    
    <div class="box-content size-40 border-0
     bg-slate-100 mx-auto mt-35 w-100 h-80  rounded-xl p-5">

         <h2 class="text-center text-red-400 text-2xl">Login</h2>

        <h3 class="ml-10 mt-4 text-blue-600">Username</h3>

        <input type="text" placeholder="Enter your mail ID" required class="size-4 
        border-0 w-80 h-10  ml-10 bg-slate-300 rounded-lg mt-4">

        <h3 class="ml-10 mt-4 text-blue-600">Password</h3>

        <input type="password" placeholder="Enter your Password" required class="size-4 
        border-0 w-80 h-10 bg-slate-300 ml-10 rounded-lg mt-4">

        <input type="submit" value="Login" class=" 
            w-50 h-10 text-center mt-10 ml-22 rounded-xl
             bg-sky-500 hover:bg-sky-700">
        </div>

    </div>
    
     
     
</body>
</html>
